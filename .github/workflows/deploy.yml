name: CI/CD - Deploy Server to AWS EC2

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/deploy.yml"
      - "server/**"
      - "docker-compose.yml"
      - "docker-compose.*.yml"
      - "server/Dockerfile"

jobs:
  test:
    name: Run Tests [Health Check & Authentication]
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/layerzero
            git pull origin dev
            docker compose up -d --build server